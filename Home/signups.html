<!DOCTYPE html>
<html lang="en">
    <head>
        <meta charset="UTF-8">
        <meta name="viewport" content="width=device-width, initial-scale=1.0">
        <title>Findit.</title>
        <link rel="stylesheet" href="signups.css">
        <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@300;400;600&display=swap"
        rel="stylesheet">
        
    </head>
    <body>
        <div class = "bigContainer">
        <div class = "header">
            <br><br>
            <h1 style="margin-top: 50px;scale: 200%;text-align: center;color: black;">Find<span style =
            "color:hsl(0, 75%, 52%);">it.</span></h1><br>
            <h2 style = "scale: 150%; margin-top: 25px;text-align: center; font-family: 'Poppins',
            sans-serif;">A place to find lost things</h2>
            <div class="app-icon" style="display: flex; justify-content: center;
            align-items: center; height: 90px;"><br><br><br>
            <img src="icon.png" alt="Icon" width="100" height="100">
       </div>
        <br>
        <form id = "form" style = "scale: 120%">
    <div class = "container"><span stylez = "font-family: 'Poppins',
            sans-serif;">
       
            <div class = "question">
                <label class = "label">Full Name:</label><br>
                <input id = "nameS" type="text" placeholder="Enter your Full Name"style = "width:
                250px; padding: 5px; border-radius : 7px;"required>
            </div>
            <div class = "question">
                <label class = "label">Password:</label><br>
                <input id = "passwordS" type="password" placeholder="Enter your Password"style = "width:
                250px; padding: 5px; border-radius : 7px;"required>
            </div>
            <div class = "question">
                <label class = "label">Email:</label><br>
                <input id = "emailS"type ="email" placeholder = "Enter your Email"style = "width:
                250px; padding: 5px; border-radius: 7px;"required>
            </div>
            <div class = "question">
                <label class = "label">Phone Number:</label><br>
                <input id = "pnS"type="tel" placeholder="Enter your phone number"style="width:
                250px; padding: 5px; border-radius: 7px;"required>
            </div>
            <div class = "question">
                <label class = "label">School:</label><br>
                <input id = "schoolS"type="text" placeholder="Enter your school"style = "width:
                250px; padding: 5px; border-radius: 7px;"required><br><br>
                <label class = "label" style = "font-size: 20px;" >Zip code:</label><br>
                <input id = "zipS"type="text" placeholder="Zip code"style = "width: 100px;
                padding: 5px; border-radius: 7px;text-align: center;"required>
            </div>.  
    
            <div>
                <button class="button" id = "signUpButton" style="width: 400px;" type = “submit”>Submit</button>
            </div>

    </div>
        




        </form>
        </div>
        </span>



        <script src="signups.js" type="module"></script>
    </body>
</html>
