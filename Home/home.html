<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Findit</title>
      <link rel="stylesheet" href="home.css">
      <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@300;400;600&display=swap"
        rel="stylesheet">
    <link href="https://fonts.googleapis.com/icon?family=Material+Icons" rel="stylesheet">
<body>
    <div class = "header">
        <div class = "big-profile">
            <img class = "profile-pic" src="https://cdn.pixabay.com/photo/2015/10/05/22/37/blank-profile-picture-973460_1280.png" alt= "profile-pic">
            <div class = "profile">
                <h2>Name</h2>
                <h3>School(zip)</h3>
            </div>
        </div>
        <h1 class = "title"style="color: black; margin-top: 0;">Find<span style =
            "color:hsl(0 ,75%, 52%);">it.</span></h1>
        <button id = "signOut"><i class="material-icons">logout</i></button>
    </div>

    <nav class = "pages">
        <ul>
            <li><a href="home.html">Home</a></li>
            <li><a href = "itemlist.html">Find</a></li>
            <li><a href="claimed.html">Claimed</a></li>
        </ul>
    </nav>
    <br>
    <br>
    <br>
<div class="sheet">
    <div class="grabber"></div>
    <h2 style="margin-bottom:20px; letter-spacing:-1px;">
        New Report
    </h2>


    <div class="input-box">
        <label>Item Name: </label>
        <input type="text" id="itemName" placeholder="Whats the name?">
    </div>


   
        <div class="input-box" style="flex:1">
            <label>Category: </label>
                <select id="category">
                    <option value="Supplies">School Supplies</option>
                    <option value="Tech">Tech</option>
                    <option value="Clothing">Clothing</option>
                    <option value="Other">Other</option>
                </select>
        </div>


        <div class="input-box" style="flex:1">
            <label>Location: </label>
            <input type="text" id="location" placeholder="Where?">
        </div>
   

    <div class="input-box">
        <label>Description:</label>
        <input style= "width: 300px; ;"  type="text" id="description" placeholder="Details...">
    </div>
<div>
            <label class = "button"> Add Image
                <input type = "file" src = "img.jpg" accept=".jpg">
            </label>
            <img src = "img.jpg" alt = "No Image Added">
            <button class = "button" id = "postButton" >Post</button>
            </div>
</div>
    <button id="newReport" style = "display: flex; flex-direction: column;">New Report</button>
</div>



<script src="home.js" type="module"></script>


</body>
</html>
